[project]
name = "ml4biz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zhiqian-Zhangcc", email = "1539990794@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ijson>=3.5.1",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.63.0",
    "xgboost>=3.4.1",
]

[project.scripts]
ml4biz = "ml4biz:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "ml4biz",
]
